global
  log stdout format raw local0

defaults
  mode http
  log global
  option httplog
  timeout connect 3s
  timeout client 30s
  timeout server 30s

resolvers docker
  nameserver embedded 127.0.0.11:53
  hold valid 2s

frontend story
  bind :8000
  default_backend api

backend api
  balance roundrobin
  option httpchk GET /ready
  http-check expect status 200
  server-template api 8 api:8000 check inter 2s fall 2 rise 1 resolvers docker init-addr none resolve-prefer ipv4
