apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: story-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: story-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: story-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: story-worker
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
