apiVersion: apps/v1
kind: Deployment
metadata:
  name: story-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: story-worker
  template:
    metadata:
      labels:
        app: story-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: story-worker
      containers:
      - name: worker
        image: IMAGE_REPLACE_ME
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        command:
        - python
        - -m
        - app.worker
        envFrom:
        - configMapRef:
            name: story-worker-settings
        env:
        - name: WORKER_HEALTH_FILE
          value: /tmp/story-worker-live
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: story-db
              key: database-url
        - name: PLOT_URL
          value: http://plot:8000
        - name: CHARACTER_URL
          value: http://character:8000
        - name: DIALOGUE_URL
          value: http://dialogue:8000
        - name: REFINEMENT_URL
          value: http://refinement:8000
        startupProbe:
          exec:
            command: [python, -m, app.worker_health, live]
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          exec:
            command: [python, -m, app.worker_health, live]
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          exec:
            command: [python, -m, app.worker_health, ready]
          periodSeconds: 10
          timeoutSeconds: 4
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: 1000m
            memory: 512Mi
