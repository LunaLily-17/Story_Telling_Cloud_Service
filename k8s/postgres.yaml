apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: story-db-init
data:
  01-app-role.sh: |
    # The official Postgres entrypoint sources this on an empty volume.
    psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
      -v ON_ERROR_STOP=1 -v app_password="$STORY_DB_PASSWORD" <<'SQL'
    CREATE ROLE story LOGIN PASSWORD :'app_password';
    ALTER DATABASE story OWNER TO story;
    SQL
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        storytelling-placement: primary
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: story
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: story-db
                  key: admin-password
            - name: STORY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: story-db
                  key: app-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec: &postgres-ready
              command:
                - pg_isready
                - -h
                - "127.0.0.1"
                - -U
                - postgres
                - -d
                - story
            periodSeconds: 5
          startupProbe:
            exec: *postgres-ready
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: story-db-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: local-path
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
