apiVersion: apps/v1
kind: Deployment
metadata:
  name: story-api
spec:
  template:
    spec:
      topologySpreadConstraints:
      - $patch: replace
      - maxSkew: 1
        minDomains: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app: story-api
---
