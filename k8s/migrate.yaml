apiVersion: batch/v1
kind: Job
metadata:
  generateName: story-migrate-
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: story-migrate
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
      - name: migrate
        image: IMAGE_REPLACE_ME
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        command: ["alembic", "upgrade", "head"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: story-db
              key: database-url
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
