apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-application-access
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [story-api, story-worker, story-migrate]
      ports:
        - protocol: TCP
          port: 5432
